<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.K 💜</title>
    <!-- Fuente romántica para el texto -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Fondo y estructura general */
        body {
            margin: 0;
            padding: 0;
            background-color: #a8d8ea; /* Celeste suave */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mensaje Superior Derecha */
        .mensaje-superior {
            position: absolute;
            top: 30px;
            right: 30px; 
            text-align: right; 
            font-size: 1.4rem; 
            font-family: 'Dancing Script', cursive; 
            color: #2c3e50;
            max-width: 335px;
            line-height: 1.3;
            animation: aparecerTexto 3s ease-in-out;
            z-index: 10;
        }

        /* Firma Inferior Derecha */
        .firma {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.9rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2c3e50;
            font-weight: bold;
            letter-spacing: 3px;
            opacity: 0.8;
            animation: aparecerTexto 4s ease-in-out;
            z-index: 10;
        }

        @keyframes aparecerTexto {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Contenedor central */
        #heart-container {
            position: relative;
            width: 0; 
            height: 0;
        }

        /* Contenedor individual para fijar posición y no interferir con la animación */
        .flower-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
        }

        /* Animación de florecer suave */
        .sunflower, .tulip {
            transform: scale(0); 
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            55% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- ESTILOS DEL GIRASOL MEJORADO --- */
        .sunflower {
            position: relative;
            width: 36px;
            height: 36px;
            z-index: 3; 
        }
        
        .sunflower .petal {
            position: absolute;
            top: -2px; left: 12px;
            width: 12px; height: 40px;
            background: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 2px rgba(0,0,0,0.1);
        }

        .sunflower .center {
            position: absolute;
            top: 7px; left: 7px;
            width: 22px; height: 22px;
            background: #5d4037;
            border-radius: 50%;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* --- ESTILOS DEL TULIPÁN --- */
        .tulip {
            width: 14px;
            height: 20px;
            border-radius: 40% 40% 10% 10%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            z-index: 1;
        }
        
        .tulip::before, .tulip::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 9px;
            height: 22px;
            border-radius: 40% 40% 10% 10%;
        }
        .tulip::before { left: -3px; transform: rotate(-15deg); transform-origin: bottom right; }
        .tulip::after { right: -3px; transform: rotate(15deg); transform-origin: bottom left; }
        
        .tulip-stem {
            position: absolute;
            bottom: -10px; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 12px;
            background: #4caf50;
            z-index: -1;
            border-radius: 2px;
        }
        
        /* Colores de los Tulipanes */
        .tulip.red { background: #ef5350; }
        .tulip.red::before, .tulip.red::after { background: #e53935; }
        
        .tulip.yellow { background: #ffee58; }
        .tulip.yellow::before, .tulip.yellow::after { background: #fbc02d; }
        
        .tulip.purple { background: #ab47bc; }
        .tulip.purple::before, .tulip.purple::after { background: #8e24aa; }

    </style>
</head>
<body>

    <!-- Mensaje Superior Derecha -->
    <div class="mensaje-superior">
        Se que no es lo que esperabas, o no es mucho, pero es con cariño... lokita mia :3💜
    </div>

    <!-- Contenedor del Corazón -->
    <div id="heart-container"></div>

    <!-- Firma Inferior -->
    <div class="firma">
        J.C.L.A
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('heart-container');
            const scale = 11; 

            // 1. DIBUJAR LOS 16 GIRASOLES EN EL BORDE
            const numSunflowers = 16;
            for (let i = 0; i < numSunflowers; i++) {
                let t = (i / numSunflowers) * Math.PI * 2;
                let x = scale * (16 * Math.pow(Math.sin(t), 3));
                let y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                let wrapper = document.createElement('div');
                wrapper.className = 'flower-wrapper';
                wrapper.style.left = `${x}px`;
                wrapper.style.top = `${y}px`;

                let sunflower = document.createElement('div');
                sunflower.className = 'sunflower';
                sunflower.style.animationDelay = `${i * 0.15}s`; 

                // Creando pétalos del girasol
                for(let p = 0; p < 10; p++) {
                    let petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.style.transform = `rotate(${p * 36}deg)`;
                    sunflower.appendChild(petal);
                }
                
                let center = document.createElement('div');
                center.className = 'center';
                sunflower.appendChild(center);

                wrapper.appendChild(sunflower);
                container.appendChild(wrapper);
            }

            // 2. CALCULAR ÁREA INTERNA DEL CORAZÓN (Polígono virtual)
            const poly = [];
            for(let i = 0; i < 100; i++) {
                let t = (i / 100) * Math.PI * 2;
                // El factor 0.8 asegura que los tulipanes nazcan un poco más adentro y no tapen a los girasoles
                let hx = 16 * Math.pow(Math.sin(t), 3) * 0.8; 
                let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.8;
                poly.push({x: hx, y: hy});
            }

            // Algoritmo Ray-Casting para asegurar que un punto esté dentro del corazón
            function isInside(x, y) {
                let inside = false;
                for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                    let xi = poly[i].x, yi = poly[i].y;
                    let xj = poly[j].x, yj = poly[j].y;
                    let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            }

            // 3. LLENAR EL INTERIOR CON TULIPANES DE FORMA UNIFORME
            const numTulips = 75; 
            const colors = ['red', 'yellow', 'purple'];
            let tulipsAdded = 0;

            while(tulipsAdded < numTulips) {
                // Generar coordenadas al azar dentro del rango máximo del corazón
                let rx = (Math.random() * 32 - 16); 
                let ry = (Math.random() * 34 - 17); 
                
                // Si la coordenada cae exactamente dentro de la silueta del corazón:
                if (isInside(rx, ry)) {
                    let wrapper = document.createElement('div');
                    wrapper.className = 'flower-wrapper';
                    wrapper.style.left = `${rx * scale}px`;
                    wrapper.style.top = `${ry * scale}px`;

                    let tulip = document.createElement('div');
                    let colorClass = colors[Math.floor(Math.random() * colors.length)];
                    tulip.className = `tulip ${colorClass}`;
                    
                    let delay = 2.4 + (Math.random() * 4); // Comienzan a salir cuando los girasoles terminan
                    tulip.style.animationDelay = `${delay}s`;
                    
                    let stem = document.createElement('div');
                    stem.className = 'tulip-stem';
                    tulip.appendChild(stem);

                    wrapper.appendChild(tulip);
                    container.appendChild(wrapper);
                    
                    tulipsAdded++; // Contamos solo los tulipanes que se plantaron con éxito
                }
            }
        });
    </script>
</body>
</html>
