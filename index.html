<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 💜</title>
    <!-- Importando una fuente elegante y romántica desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Fondo celeste */
        body {
            margin: 0;
            padding: 0;
            background-color: #a8d8ea; /* Celeste suave */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mensaje Superior Derecha (Actualizado) */
        .mensaje-superior {
            position: absolute;
            top: 30px;
            right: 30px; /* Movido a la derecha */
            text-align: right; /* Texto alineado a la derecha */
            font-size: 1.4rem; /* Tamaño reducido, ideal para esta fuente cursiva */
            font-family: 'Dancing Script', cursive; /* Nueva fuente bonita */
            color: #2c3e50;
            max-width: 320px;
            line-height: 1.2;
            animation: aparecerTexto 3s ease-in-out;
            z-index: 10;
        }

        /* Firma Inferior Derecha */
        .firma {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.9rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2c3e50;
            font-weight: bold;
            letter-spacing: 3px;
            opacity: 0.8;
            animation: aparecerTexto 4s ease-in-out;
            z-index: 10;
        }

        @keyframes aparecerTexto {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Contenedor del corazón */
        #heart-container {
            position: relative;
            width: 0; 
            height: 0;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* --- GIRASOLES --- */
        .sunflower {
            position: absolute;
            width: 26px;
            height: 26px;
            background-color: #5d4037; 
            border: 9px dotted #ffeb3b; 
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0); 
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 3; 
        }

        /* --- TULIPANES --- */
        .tulip {
            position: absolute;
            width: 14px;
            height: 22px;
            border-radius: 40% 40% 10% 10%;
            transform: translate(-50%, -50%) scale(0); 
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            z-index: 1;
        }
        
        .tulip::before, .tulip::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 9px;
            height: 24px;
            border-radius: 40% 40% 10% 10%;
        }
        .tulip::before { left: -3px; transform: rotate(-15deg); transform-origin: bottom right; }
        .tulip::after { right: -3px; transform: rotate(15deg); transform-origin: bottom left; }
        
        /* Colores de los Tulipanes */
        .tulip.red { background: #ef5350; }
        .tulip.red::before, .tulip.red::after { background: #e53935; }
        
        .tulip.yellow { background: #ffee58; }
        .tulip.yellow::before, .tulip.yellow::after { background: #fbc02d; }
        
        .tulip.purple { background: #ab47bc; }
        .tulip.purple::before, .tulip.purple::after { background: #8e24aa; }

    </style>
</head>
<body>

    <!-- Mensaje Superior Derecha -->
    <div class="mensaje-superior">
        Se que no es lo que esperabas, o no es mucho pero es con cariño lokita mia :3💜
    </div>

    <!-- Contenedor del Corazón de Flores -->
    <div id="heart-container"></div>

    <!-- Firma Inferior -->
    <div class="firma">
        J.C.L.A
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('heart-container');
            const scale = 11; 

            // 1. DIBUJAR LOS 16 GIRASOLES EN EL BORDE
            const numSunflowers = 16;
            for (let i = 0; i < numSunflowers; i++) {
                let t = (i / numSunflowers) * Math.PI * 2;
                
                let x = scale * (16 * Math.pow(Math.sin(t), 3));
                let y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                let sunflower = document.createElement('div');
                sunflower.className = 'sunflower';
                sunflower.style.left = `${x}px`;
                sunflower.style.top = `${y}px`;
                
                sunflower.style.animationDelay = `${i * 0.15}s`; 
                container.appendChild(sunflower);
            }

            // 2. LLENAR EL INTERIOR CON TULIPANES
            const numTulips = 55; 
            const colors = ['red', 'yellow', 'purple'];

            for (let i = 0; i < numTulips; i++) {
                let t = Math.random() * Math.PI * 2;
                let r = Math.sqrt(Math.random()) * 0.82; 
                let s = scale * r;
                
                let x = s * (16 * Math.pow(Math.sin(t), 3));
                let y = -s * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                x += (Math.random() - 0.5) * 12;
                y += (Math.random() - 0.5) * 12;

                let tulip = document.createElement('div');
                let colorClass = colors[Math.floor(Math.random() * colors.length)];
                tulip.className = `tulip ${colorClass}`;
                tulip.style.left = `${x}px`;
                tulip.style.top = `${y}px`;
                
                let delay = 2.5 + (Math.random() * 5);
                tulip.style.animationDelay = `${delay}s`;
                container.appendChild(tulip);
            }
        });
    </script>
</body>
</html>
