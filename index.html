<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.K💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #a8d8ea; 
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .mensaje-superior {
            position: absolute; top: 30px; left: 30px; 
            text-align: left; font-size: 1.4rem; 
            font-family: 'Dancing Script', cursive; 
            color: #2c3e50; max-width: 335px; line-height: 1.3;
            animation: aparecerTexto 3s ease-in-out; z-index: 10;
        }

        .firma {
            position: absolute; bottom: 20px; right: 30px;
            font-size: 0.9rem; font-weight: bold;
            letter-spacing: 3px; color: #2c3e50; opacity: 0.8;
            animation: aparecerTexto 4s ease-in-out; z-index: 10;
        }

        @keyframes aparecerTexto {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        #heart-container { position: relative; width: 0; height: 0; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* GIRASOLES REESTRUCTURADOS CON PÉTALOS LARGOS */
        .sunflower-wrapper {
            position: absolute;
            transform: scale(0);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 3;
        }
        
        .sunflower-wrapper .center {
            position: absolute;
            top: -12px; left: -12px;
            width: 24px; height: 24px;
            background: #4e342e; /* Centro café oscuro realista */
            border-radius: 50%;
            z-index: 2;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
        }

        .sunflower-wrapper .petal {
            position: absolute;
            bottom: 0; left: -4px; /* Centrado respecto al origen */
            width: 8px; height: 26px; /* Pétalos largos y definidos */
            background: #fbc02d; 
            border-radius: 4px 4px 2px 2px;
            transform-origin: bottom center; /* Pivotan desde el centro exacto */
            z-index: 1;
            box-shadow: 0 0 2px rgba(0,0,0,0.15);
        }

        /* TULIPANES */
        .tulip-wrapper {
            position: absolute;
            transform: scale(0);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 1;
        }

        .tulip-wrapper .stem {
            position: absolute;
            top: 0; left: -1px;
            width: 3px; height: 16px;
            background: #4caf50;
            border-radius: 2px;
            z-index: 1;
        }

        .tulip-wrapper .tulip-head {
            position: absolute;
            top: -14px; left: -7px;
            width: 14px; height: 20px;
            border-radius: 40% 40% 10% 10%;
            z-index: 2;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }
        
        .tulip-head::before, .tulip-head::after {
            content: ''; position: absolute; bottom: 0;
            width: 9px; height: 22px; border-radius: 40% 40% 10% 10%;
        }
        .tulip-head::before { left: -3px; transform: rotate(-15deg); transform-origin: bottom right; }
        .tulip-head::after { right: -3px; transform: rotate(15deg); transform-origin: bottom left; }
        
        .tulip-head.red { background: #ef5350; }
        .tulip-head.red::before, .tulip-head.red::after { background: #e53935; }
        .tulip-head.yellow { background: #ffee58; }
        .tulip-head.yellow::before, .tulip-head.yellow::after { background: #fbc02d; }
        .tulip-head.purple { background: #ab47bc; }
        .tulip-head.purple::before, .tulip-head.purple::after { background: #8e24aa; }

    </style>
</head>
<body>

    <div class="mensaje-superior">
        Se que no es lo que esperabas, o no es mucho, pero es con cariño... lokita mia :3💜
    </div>

    <div id="heart-container"></div>

    <div class="firma">
        J.C.L.A
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('heart-container');
            const scale = 12; // Tamaño general del corazón

            // 1. DIBUJAR LOS GIRASOLES (Borde del corazón)
            const numSunflowers = 24; 
            for (let i = 0; i < numSunflowers; i++) {
                let t = (i / numSunflowers) * Math.PI * 2;
                let x = scale * (16 * Math.pow(Math.sin(t), 3));
                let y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                let wrapper = document.createElement('div');
                wrapper.className = 'sunflower-wrapper';
                wrapper.style.left = `${x}px`;
                wrapper.style.top = `${y}px`;
                wrapper.style.animationDelay = `${i * 0.12}s`; 

                // Agregar el centro café
                let center = document.createElement('div');
                center.className = 'center';
                wrapper.appendChild(center);

                // Agregar los 12 pétalos alargados
                for(let p = 0; p < 12; p++) {
                    let petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.style.transform = `rotate(${p * 30}deg)`;
                    wrapper.appendChild(petal);
                }
                container.appendChild(wrapper);
            }

            // 2. CREAR LÍMITES MATEMÁTICOS PARA LOS TULIPANES (Más adentro para no encimarse)
            const poly = [];
            for (let i = 0; i < 100; i++) {
                let t = (i / 100) * Math.PI * 2;
                let px = scale * (16 * Math.pow(Math.sin(t), 3)) * 0.75; 
                let py = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.75;
                poly.push({x: px, y: py});
            }

            // Algoritmo de punto en polígono (Ray-Casting)
            function isInside(x, y) {
                let inside = false;
                for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                    let xi = poly[i].x, yi = poly[i].y;
                    let xj = poly[j].x, yj = poly[j].y;
                    let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            }

            // 3. DISTRIBUCIÓN UNIFORME DE LOS TULIPANES
            const numTulips = 80; 
            const colors = ['red', 'yellow', 'purple'];
            let tulipsAdded = 0;
            let safetyCounter = 0;

            while(tulipsAdded < numTulips && safetyCounter < 5000) {
                safetyCounter++;
                
                // Generar posiciones aleatorias sobre un área cuadrada amplia
                let rx = (Math.random() * 40 - 20) * scale;
                let ry = (Math.random() * 40 - 20) * scale;
                
                // Si el punto cae exactamente DENTRO de la silueta escalada del corazón, lo plantamos
                if (isInside(rx, ry)) {
                    let wrapper = document.createElement('div');
                    wrapper.className = 'tulip-wrapper';
                    wrapper.style.left = `${rx}px`;
                    wrapper.style.top = `${ry}px`;
                    
                    let delay = 2.5 + (Math.random() * 4); // Comienzan después de los girasoles
                    wrapper.style.animationDelay = `${delay}s`;

                    let stem = document.createElement('div');
                    stem.className = 'stem';
                    
                    let head = document.createElement('div');
                    let colorClass = colors[Math.floor(Math.random() * colors.length)];
                    head.className = `tulip-head ${colorClass}`;

                    wrapper.appendChild(stem);
                    wrapper.appendChild(head);
                    container.appendChild(wrapper);
                    
                    tulipsAdded++;
                }
            }
        });
    </script>
</body>
</html>
